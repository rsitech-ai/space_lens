name: SpaceLens
options:
  bundleIdPrefix: com.rsitech
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.6"
settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "2NY8A789TN"
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
packages: {}
targets:
  SpaceLens:
    type: application
    platform: macOS
    sources:
      - path: Sources/SpaceLens
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SpaceLens
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Rafal Sikora. All rights reserved.
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: Config/SpaceLens.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsitech.spacelens
        PRODUCT_NAME: SpaceLens
        PRODUCT_MODULE_NAME: SpaceLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/SpaceLens.entitlements
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  SpaceLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpaceLensTests
    dependencies:
      - target: SpaceLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rsitech.spacelens.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SpaceLens.app/Contents/MacOS/SpaceLens
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SpaceLens:
    build:
      targets:
        SpaceLens: all
        SpaceLensTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpaceLensTests
    archive:
      config: Release
